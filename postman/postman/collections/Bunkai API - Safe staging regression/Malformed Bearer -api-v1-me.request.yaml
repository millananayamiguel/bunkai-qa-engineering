$kind: http-request
name: Malformed Bearer /api/v1/me
url: '{{base_url}}/api/v1/me'
method: GET
headers:
  Authorization: Bearer malformed-token
scripts:
  - type: afterResponse
    code: |
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"error":{"type":"object","properties":{"code":{"type":"string","enum":["bad_request","validation_failed","unauthorized","forbidden","not_found","method_not_allowed","conflict","idempotency_key_required","idempotency_key_invalid","rate_limited","ac_outside_user_story","module_outside_project_subtree","steps_position_invalid","slug_collision","chain_empty","chain_mismatch","chain_invalid","no_executable_steps","environment_invalid","test_outside_plan_project","internal_error","upstream_error"],"description":"Machine-readable error code. Branch on this value, not on `message`."},"message":{"type":"string","description":"Human-readable error description."},"details":{"description":"Optional structured details. For validation errors this is the ZodError issues array."},"request_id":{"type":"string","description":"Echoed `x-request-id`. Quote this in bug reports."}},"required":["code","message"]}},"required":["error"],"description":"Canonical error envelope returned by every `/api/v1` route on failure."}); });
      pm.test("Canonical error code", function () { pm.expect(pm.response.json().error.code).to.eql("unauthorized"); });
    language: text/javascript
order: 4000
