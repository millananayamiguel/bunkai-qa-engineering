$kind: collection
name: Bunkai API - Safe staging regression
variables:
  - key: base_url
    value: ''
    description: 'Base URL of the Bunkai staging API (e.g. https://staging.bunkai.io)'
  - key: run_pat
    value: ''
    description: PAT token minted during this run (set automatically by Sign in request)
  - key: run_pat_id
    value: ''
    description: PAT ID minted during this run (set automatically by Sign in request)
  - key: run_user_id
    value: ''
    description: User ID of the signed-in user (set automatically by Sign in request)
