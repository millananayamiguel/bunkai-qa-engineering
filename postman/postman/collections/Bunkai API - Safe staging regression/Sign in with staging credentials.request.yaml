$kind: http-request
url: '{{base_url}}/api/v1/auth/signin'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "{{staging_email}}", "password": "{{staging_password}}", "pat_name": "postman-safe-regression", "pat_scopes": ["atc:read"], "pat_expires_in_days": 1}'
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.unset("run_pat"); pm.collectionVariables.unset("run_pat_id"); pm.collectionVariables.unset("run_user_id");
      if (!pm.variables.get("staging_email") || !pm.variables.get("staging_password")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"user":{"type":"object","properties":{"id":{"type":"string","format":"uuid"},"email":{"type":["string","null"],"format":"email"}},"required":["id","email"]},"session":{"type":"object","properties":{"access_token":{"type":"string"},"refresh_token":{"type":"string"},"expires_at":{"type":"number"},"token_type":{"type":"string"}},"required":["access_token","refresh_token"]},"pat":{"type":"object","properties":{"token":{"type":"string"},"id":{"type":"string","format":"uuid"},"name":{"type":["string","null"]},"scopes":{"type":"array","items":{"type":"string","enum":["atc:read","atc:write","run:execute","workspace:admin"]}},"expires_at":{"type":["string","null"],"format":"date-time"}},"required":["token","id","name","scopes","expires_at"]},"warning":{"type":"string"}},"required":["user","session","pat","warning"]}); });
      if (pm.response.code === 200) { const b=pm.response.json(); pm.collectionVariables.set("run_pat", b.pat.token); pm.collectionVariables.set("run_pat_id", b.pat.id); pm.collectionVariables.set("run_user_id", b.user.id); }
      pm.test("Read-only credential minted", function () { pm.expect(pm.response.json().pat.scopes).to.eql(["atc:read"]); });
    language: text/javascript
order: 13000
