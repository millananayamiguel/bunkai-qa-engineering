$kind: http-request
url: '{{base_url}}/api/v1/workspaces'
method: GET
headers:
  Authorization: Bearer {{run_pat}}
scripts:
  - type: beforeRequest
    code: if (!pm.collectionVariables.get("run_pat")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"workspaces":{"type":"array","items":{"allOf":[{"type":"object","properties":{"id":{"type":"string","format":"uuid"},"slug":{"type":"string"},"name":{"type":"string"},"owner_user_id":{"type":"string","format":"uuid"},"plan":{"type":"string","enum":["community","cloud","enterprise"]},"created_at":{"type":"string","format":"date-time"}},"required":["id","slug","name","owner_user_id","plan","created_at"]},{"type":"object","properties":{"role":{"type":["string","null"],"enum":["viewer","member","admin","owner",null]}},"required":["role"]}]}}},"required":["workspaces"]}); });
      pm.test("No credential secrets in workspace response", function () { pm.expect(pm.response.text()).not.to.match(/token_hash|password_hash|refresh_token|bk_pat_/); });
    language: text/javascript
order: 15000
