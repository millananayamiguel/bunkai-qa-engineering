$kind: http-request
url: '{{base_url}}/api/v1/tokens/{{run_pat_id}}'
method: DELETE
scripts:
  - type: beforeRequest
    code: if (!pm.collectionVariables.get("run_pat_id")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Credential cleanup returns 204", function () { pm.response.to.have.status(204); });
      if (pm.response.code === 204) { pm.collectionVariables.unset("run_pat"); pm.collectionVariables.unset("run_pat_id"); pm.collectionVariables.unset("run_user_id"); }
    language: text/javascript
order: 17000
