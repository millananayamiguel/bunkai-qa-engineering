$kind: http-request
url: '{{base_url}}/api/v1/health'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"ok":{"type":"boolean","enum":[true]},"service":{"type":"string","example":"bunkai-tms"},"env":{"type":"string","enum":["local","staging","production"]},"ts":{"type":"string","format":"date-time","description":"ISO 8601 timestamp of the probe."}},"required":["ok","service","env","ts"]}); });
      pm.test("Staging service identity", function () { const b=pm.response.json(); pm.expect(b.ok).to.eql(true); pm.expect(b.service).to.eql("bunkai-tms"); pm.expect(b.env).to.eql("staging"); pm.expect(Number.isNaN(Date.parse(b.ts))).to.eql(false); });
    language: text/javascript
order: 1000
