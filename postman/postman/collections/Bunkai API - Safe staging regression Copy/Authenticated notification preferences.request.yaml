$kind: http-request
url: '{{base_url}}/api/v1/notification-preferences'
method: GET
headers:
  - key: Authorization
    value: Bearer {{run_pat}}
scripts:
  - type: beforeRequest
    code: if (!pm.collectionVariables.get("run_pat")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"preferences":{"type":"array","items":{"type":"object","properties":{"event_type":{"type":"string"},"channel":{"type":"string","enum":["in_app","email"]},"enabled":{"type":"boolean"},"locked":{"type":"boolean"}},"required":["event_type","channel","enabled","locked"]}}},"required":["preferences"]}); });
    language: text/javascript
order: 16000
