$kind: http-request
url: '{{base_url}}/api/v1'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"version":{"type":"string","enum":["v1"]},"openapi":{"type":"string","example":"/api/openapi"},"docs":{"type":"string","example":"/api/docs"},"status":{"type":"string","enum":["live"]}},"required":["version","openapi","docs","status"]}); });
      pm.test("Discovery points to documentation", function () { const b=pm.response.json(); pm.expect(b.version).to.eql("v1"); pm.expect(b.openapi).to.eql("/api/openapi"); pm.expect(b.status).to.eql("live"); });
    language: text/javascript
order: 2000
