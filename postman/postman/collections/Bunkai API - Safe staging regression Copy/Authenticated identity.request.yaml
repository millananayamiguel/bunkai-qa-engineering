$kind: http-request
url: '{{base_url}}/api/v1/me'
method: GET
headers:
  - key: Authorization
    value: Bearer {{run_pat}}
scripts:
  - type: beforeRequest
    code: if (!pm.collectionVariables.get("run_pat")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("JSON content type", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("Matches source OpenAPI schema", function () { pm.response.to.have.jsonSchema({"type":"object","properties":{"user":{"type":"object","properties":{"id":{"type":"string","format":"uuid"},"email":{"type":["string","null"],"format":"email"}},"required":["id","email"]},"workspaces":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","format":"uuid"},"slug":{"type":"string"},"name":{"type":"string"},"plan":{"type":"string","enum":["community","cloud","enterprise"]},"owner_user_id":{"type":"string","format":"uuid"},"created_at":{"type":"string","format":"date-time"}},"required":["id","slug","name","plan","owner_user_id","created_at"]}},"active_workspace_id":{"type":["string","null"],"format":"uuid"},"active_workspace_role":{"type":["string","null"],"enum":["viewer","member","admin","owner",null]},"auth":{"type":"object","properties":{"source":{"type":"string","enum":["cookie","bearer"]},"scopes":{"type":"array","items":{"type":"string"}}},"required":["source","scopes"]}},"required":["user","workspaces","active_workspace_id","active_workspace_role","auth"]}); });
      pm.test("Identity matches signed-in user", function () { pm.expect(pm.response.json().user.id).to.eql(pm.collectionVariables.get("run_user_id")); pm.expect(pm.response.json().auth.source).to.eql("bearer"); });
    language: text/javascript
order: 14000
